# [GH-3] [I-01] [I-02] Python package and mandated quality toolchain.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "koreo"
version = "0.1.0"
description = "A lightweight desktop editor for planning choreography"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
]

[project.scripts]
koreo = "koreo.app:main"

[dependency-groups]
dev = [
    "black>=25.1",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-qt>=4.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/koreo"]

[tool.black]
target-version = ["py312"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
